services:
  rfc-rag:
    build: .
    image: rfc-rag:latest
    container_name: rfc-rag
    restart: unless-stopped

    # ВАЖНО: слушаем только петлевой адрес. Если написать "7860:7860", docker
    # пропишет свои правила в iptables в обход ufw, и порт окажется открыт
    # в интернет при том, что ufw показывает deny. Наружу пускает только nginx.
    ports:
      - "127.0.0.1:7860:7860"

    # Индекс лежит на хосте и монтируется только на чтение: сервису он нужен,
    # но менять его оттуда незачем.
    volumes:
      - ./data:/data:ro

    env_file: .env

    # На сервере 1.9 ГБ памяти, и на нём же живёт VPN пятнадцати устройств.
    # Потолок нужен, чтобы утечка или всплеск в питоне не выдавили VPN в своп:
    # контейнер упрётся в лимит и умрёт сам, а не утянет за собой всё остальное.
    mem_limit: 768m

    # Иначе логи растут до заполнения диска — на маленьком VPS это вопрос времени.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
